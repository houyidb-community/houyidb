[package]
name = "houyi-mobile-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "HouyiDB Mobile Android JNI bridge"

[lib]
crate-type = ["cdylib"]

[dependencies]
houyi-mobile = { path = "../houyi-mobile", version = "0.2.0-beta.9" }
houyi-vector = { path = "../houyi-vector", version = "0.2.0-beta.9", default-features = false, features = ["portable", "simd-neon"] }
jni = "0.21"
