[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houyidb"
version = "0.2.0b8"
description = "Python SDK for HouyiDB — single-node vector database (collections HTTP API)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "HouyiDB Contributors" }]
keywords = ["vector-database", "hnsw", "rag", "houyidb"]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/houyidb-community/houyidb"
Repository = "https://github.com/houyidb-community/houyidb"
Documentation = "https://github.com/houyidb-community/houyidb/blob/main/docs/USER_MANUAL.md"

[tool.setuptools.packages.find]
include = ["houyidb*"]
