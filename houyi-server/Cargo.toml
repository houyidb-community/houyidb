[package]
name = "houyi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["portable"]
portable = ["houyi-core/portable", "houyi-vector/portable"]
simd-avx2 = ["houyi-vector/simd-avx2"]
simd-neon = ["houyi-vector/simd-neon"]
simd-avx512 = ["houyi-core/simd-avx512", "houyi-vector/simd-avx512"]
cxl-memory = ["houyi-core/cxl-memory", "houyi-vector/cxl-memory"]
ha-raft = ["houyi-core/ha-raft", "houyi-vector/ha-raft"]
# P4.5.5 turmoil 确定性网络仿真：把复制层网络类型换到仿真实现。只在本地
# DST 测试构建启用（`cargo test --features turmoil-dst`）；默认构建与生产
# 依赖图完全不换型。
turmoil-dst = ["houyi-persistence/turmoil", "dep:turmoil"]
# P4.5.4 crash chaos：转发故障注入 feature 给 houyi-persistence。仅演练脚本
# `scripts/chaos_drill.sh` 使用；默认关闭，生产构建不含注入点实现。
failpoints = ["houyi-persistence/failpoints"]

[dev-dependencies]
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio-postgres = "0.7"
# TLS 测试自签证书生成(P4.2.2)
rcgen = "0.13"
# P4.5.0 属性化测试基座：恢复状态机（随机 op + 随机崩溃点 vs 参考模型）。
proptest.workspace = true
proptest-state-machine.workspace = true

[dependencies]
houyi-core = { path = "../houyi-core", version = "0.2.0-beta.8" }
houyi-persistence = { path = "../houyi-persistence", version = "0.2.0-beta.8" }
houyi-query = { path = "../houyi-query", version = "0.2.0-beta.8" }
houyi-vector = { path = "../houyi-vector", version = "0.2.0-beta.8" }
tokio.workspace = true
# P4.5.5：ReplicationApply 的 async 实现宏。
async-trait.workspace = true
# 确定性网络仿真（可选，仅 feature `turmoil-dst`；默认构建不进依赖图）。
turmoil = { workspace = true, optional = true }
axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# 快照 payload CRC（P5.0.2）。 / Snapshot payload CRC (P5.0.2).
crc32fast.workspace = true
# follower 稳定身份生成（P5.0.4）。 / Stable follower identity (P5.0.4).
rand.workspace = true
# TOML 配置文件(P4.3.1)
toml.workspace = true
# OpenAI 兼容网关依赖（选型理由见根 manifest [workspace.dependencies] 注释）。
ureq.workspace = true
blake2.workspace = true
# 审计哈希链（P4.7.0）。
sha2.workspace = true
# 可观测性(P4.0)：本 crate 既发事件也安装订阅器（二进制入口）。
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# TLS(P4.2.2):HTTP 与 pgwire 共用一套 rustls acceptor
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
